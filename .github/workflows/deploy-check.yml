# Pre-flight for the public demo (F2): build the serving image and run it under the free
# instance's real limits, on Linux, without anyone needing Docker on their laptop.
#
# Run it from the Actions tab (Run workflow) and paste the index release URL. It fails if the
# container is killed for memory (exit 137), if a startup check fails, or if the deployed
# safety properties do not hold — admin routes reachable, or a question answered without a key.
#
# GitHub's runners are far larger than the target instance, so the container is capped to the
# same 512 MB / 0.1 CPU Render's free plan gives it. That cap, not the runner, is the test.

name: deploy check

on:
  workflow_dispatch:
    inputs:
      index_url:
        description: "Download URL of the index release asset (index.tar.gz)"
        required: true
        type: string
      memory:
        description: "Container memory limit"
        required: false
        default: "512m"
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build the serving image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg INDEX_URL="${{ inputs.index_url }}" \
            -t amr .

      - name: Report image size
        run: |
          docker image inspect amr --format 'image size {{.Size}} bytes'

      - name: Start it under the free instance's limits
        run: |
          docker run -d --name amr -p 8000:8000 \
            --memory=${{ inputs.memory }} --memory-swap=${{ inputs.memory }} --cpus=0.1 \
            amr
          # 0.1 CPU makes startup slow: the index load alone takes ~10x the laptop time
          for i in $(seq 1 90); do
            if curl -fsS localhost:8000/readyz 2>/dev/null | grep -q '"ready":true'; then
              echo "ready after ${i}0s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' amr)" != "true" ]; then
              echo "::error::container stopped during startup (exit $(docker inspect -f '{{.State.ExitCode}}' amr))"
              docker logs amr; exit 1
            fi
            sleep 10
          done

      - name: Startup checks all pass
        run: |
          curl -fsS localhost:8000/readyz -o readyz.json || (docker logs amr; exit 1)
          python - <<'PY'
          import json, sys
          d = json.load(open("readyz.json"))
          print(json.dumps(d, indent=2)[:1500])
          failed = [c for c in d["checks"] if not c["ok"]]
          assert d["ready"] is True, "not ready"
          assert not failed, f"failed checks: {failed}"
          assert d["byok_only"] is True, "BYOK_ONLY is not set in the image"
          assert d["public_deploy"] is True, "PUBLIC_DEPLOY is not set in the image"
          assert d["admin_enabled"] is False, "admin routes are enabled"
          PY

      - name: The deployed safety properties hold
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code localhost:8000/healthz)" = 200                       || exit 1
          test "$(code localhost:8000/api/admin/cache/stats)" = 404         || exit 1
          test "$(code localhost:8000/api/admin/clock)" = 404               || exit 1
          test "$(code -X POST localhost:8000/api/ask -H 'Content-Type: application/json' \
                   -d '{"question":"What were total assets?"}')" = 401      || exit 1
          test "$(code -X POST localhost:8000/api/key/test \
                   -H 'X-Provider: groq' -H 'X-Provider-Key: gsk_definitely_not_a_real_key_00')" = 401 || exit 1
          # the page and its own relative assets
          test "$(code localhost:8000/)" = 200                              || exit 1
          test "$(code localhost:8000/app.js)" = 200                        || exit 1
          test "$(code localhost:8000/vendor/purify.min.js)" = 200          || exit 1
          echo "all deployed-safety checks passed"

      - name: Memory under the cap
        run: |
          docker stats amr --no-stream --format 'memory: {{.MemUsage}}  ({{.MemPerc}} of the cap)'
          # a retrieval-only path exercises the index without needing anyone's model key
          for i in 1 2 3; do
            curl -s -o /dev/null -X POST localhost:8000/api/ask \
              -H 'Content-Type: application/json' \
              -H 'X-Provider: groq' -H 'X-Provider-Key: gsk_definitely_not_a_real_key_00' \
              -d '{"question":"What were total assets as of Jan 25, 2026?"}' || true
          done
          docker stats amr --no-stream --format 'after 3 questions: {{.MemUsage}} ({{.MemPerc}})'
          test "$(docker inspect -f '{{.State.Running}}' amr)" = "true" || {
            echo "::error::container died — exit $(docker inspect -f '{{.State.ExitCode}}' amr) (137 means out of memory)"
            docker logs --tail 50 amr; exit 1; }

      - name: No key in the logs
        run: |
          if docker logs amr 2>&1 | grep -E 'gsk_[A-Za-z0-9_-]{8,}|sk-ant-|AIza[0-9A-Za-z_-]{16,}'; then
            echo "::error::a provider key shape appears in the container logs"; exit 1
          fi
          echo "logs are clean"

      - name: Container logs
        if: always()
        run: docker logs amr 2>&1 | tail -60

      - name: Stop
        if: always()
        run: docker rm -f amr || true
