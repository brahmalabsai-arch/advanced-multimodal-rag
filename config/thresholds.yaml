# Tunables (architecture §11.1). This file's hash is part of `retrieval_config_hash` (§5.7),
# so any edit here invalidates the semantic cache by design.
retrieval:
  embedder: bge-small              # locked at the Phase 3 embedder gate (D-47); index dir follows
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  final_k: 8
  max_retrieval_queries: 4
expansion:                         # architecture §4.4; Phase 4
  glossary: true                   # canonical row-fact phrasing per metric / formula input
  filters: true                    # statement + modality pre-filter on glossary queries (§4.5)
  llm_fallback: true               # one `small` call when rule confidence < min_rule_confidence
  min_rule_confidence: 0.8
  max_paraphrases: 2
  hyde: false                      # numbers-free HyDE, EXPLANATORY only (D-23): no measured
                                   # benefit in docs/reports/retrieval_ablation.md, so off by default
  hyde_regenerate: true            # one retry when the passage contains digits, else dropped
rerank:
  model: BAAI/bge-reranker-base
  lightweight_alternative: Xenova/ms-marco-MiniLM-L-6-v2
  candidates: 30
  margin_skip_ratio: 0.30
  drop_floor_logit: -2.0           # bge-reranker-base logits; see docs/reports/retrieval_ablation.md
  enabled: false                   # D-24: reranking lowered recall@8 (0.95 -> 0.91 gated) at ~5 s
                                   # per query on this corpus; gate + reranker stay measurable
  min_keep: 3
compression:                       # architecture §6; Phase 5
  enabled: true
  mode: classifier                 # classifier | never | always (ablation arms; `always` = EXTRACT_LLM on all narrative)
  skip_budget_tokens: 1500
  narrative_pressure_ratio: 1.0    # R5: narrative is cut only when candidates exceed the budget (Phase 5
                                   # ablation: cutting a context that already fits saved 1.4% of large-model
                                   # input and lost keywords on 2 of 11 narrative answers)
  dedupe_cosine: 0.98              # Phase 5: the three H20 disclosures sit at 0.94-0.96 and are paraphrases
                                   # of different length, not copies; 0.95 merged content (G11 lost "license")
  sentence_relevance_tau: 0.62     # calibrated Phase 5: bge-small sentence-query cosine p50 = 0.60 (gold and non-gold alike); 0.62 keeps ~45% of sentences
  numeric_density_cap: 0.15
  min_reduction_for_llm: 0.40      # quota mode on free tier (§6.6)
  stage_b_thresholds: {keep: 0.35, llm: 0.60}
  stage_b: rules                   # rules | learned (Stage C, §6.7). `learned` scores
                                   # src/rag/compress/classifier_weights.json with NumPy; Phase 7
                                   # measured it against the rules — see docs/reports/stage_c_classifier.md
completeness:                      # query/coverage.py: after verification, did the answer cover every ask?
  enabled: true                    # rules over slots + calculations (free, deterministic)
  self_check: true                 # plus one small-model call when the question has several asks
cache:                             # architecture §5; Phase 6
  enabled: true                    # false = every request runs the pipeline (cache_tier "bypassed")
  l1: {max_entries: 512, ttl_seconds: 3600, policy: lru}
  l2:
    max_entries: 5000
    similarity: {slot_rich: 0.85, slot_poor: 0.90}       # calibrated Phase 6 (D-59) from the design's 0.90 / 0.95
                                                          # (RedisVL default distance 0.1): the hard slot guard (entity,
                                                          # period, metric, direction, negation, ask, aggregation) blocks
                                                          # 286/286 adversarial pairs on its own; bge-small paraphrases of
                                                          # the same question sit at cosine 0.80-0.90 while same-slot
                                                          # *different* questions sit at 0.93-0.97, so a higher threshold
                                                          # buys no precision and costs recall (docs/reports/cache_threshold_calibration.md)
    ttl_seconds: {filed_fact: 2592000, analytical: 604800, time_anchored: 86400, negative: 86400}
    eviction: {policy: redis_volatile_lfu, lfu_init_val: 5, lfu_log_factor: 10, lfu_decay_minutes: 1440}
    embed_text: canonical          # raw | normalized | canonical: canonical slot text ("total_assets ... fy2026") gives
                                   # paraphrases p50 0.869 vs 0.829 normalised (docs/reports/cache_threshold_calibration.md)
  sweep_interval_seconds: 900
