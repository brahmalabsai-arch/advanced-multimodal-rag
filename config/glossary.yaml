# Finance glossary for slot extraction and query expansion (architecture §4.2, §4.4).
#
# `metrics` map user phrasings to the `line_item_norm` of a row fact (the key) on a statement;
# `formulas` map phrasings to a formula id in `formulas.yaml`; `statements` map phrasings to a
# statement id; `lexicons` hold the direction / aggregation / time-anchor words. Matching is
# longest-phrase-first on the normalised question (lower-case, punctuation stripped), so
# "total current assets" wins over "current assets" wins over "assets".
#
# This file's hash is part of `retrieval_config_hash` (§5.7). Schema: `core/config.py`.

version: 1

statements:
  balance_sheet:
    label: Consolidated Balance Sheets
    synonyms: [balance sheet, balance sheets, statement of financial position, financial position, consolidated balance sheets]
  income_statement:
    label: Consolidated Statements of Income
    synonyms: [income statement, income statements, statement of income, statements of income, statement of operations, profit and loss, p&l, consolidated statements of income]
  cash_flow:
    label: Consolidated Statements of Cash Flows
    synonyms: [cash flow statement, cash flow statements, statement of cash flows, statements of cash flows, cash flows statement, consolidated statements of cash flows]

