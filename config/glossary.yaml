lexicons:
  direction:
    increase: [increase, increased, increases, increasing, grow, grew, grown, growth, rise, rose, risen, up, higher, gain, gained, expand, expanded, improve, improved, jump, jumped, climb, climbed]
    decrease: [decrease, decreased, decreases, decreasing, decline, declined, declines, fall, fell, fallen, drop, dropped, down, lower, shrink, shrank, reduce, reduced, reduction, contract, contracted, worsen, worsened]
  aggregation:
    yoy: [year-over-year, year over year, yoy, y/y, from the prior year, versus the prior year, versus last year, compared to the prior year, compared with the prior year, over the prior year]
    change: [change, changed, changes, difference, delta, movement, move, moved, vary, varied]
    growth: [grow, grew, grown, growth, increase, increased, decrease, decreased, decline, declined, rise, rose, fall, fell]
    pct: [percentage, percent, by what percent, by what percentage, percentage change, percent change]
    ratio: [ratio, proportion, share of, as a share of, as a percentage of, relative to, divided by]
    compare: [compare, compared, comparison, versus, vs, vs., against, relative to]
    total: [total, sum, combined, aggregate, together]
