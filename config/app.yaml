# Application settings (architecture §11.3). Localhost only during the build (D-44).
# Phase 8: `max_question_chars` and `request_timeout_seconds` are the input limits (§13);
# startup refuses a non-loopback bind and the request guard rejects non-loopback clients.
server:
  host: ${SERVER_HOST:127.0.0.1}   # 0.0.0.0 only in the deployed container (F2)
  port: 8000
  workers: 1
  max_question_chars: 1000
  request_timeout_seconds: 120
  rate_limit:                      # public deploy only (PUBLIC_DEPLOY=true); D-70
    enabled: true
    ask_per_minute: 6              # per visitor address; a person reading answers asks ~1-3
    ask_per_hour: 60
    key_test_per_minute: 5
    max_in_flight: 2               # questions running at once across all visitors (0.1 CPU)
    client_ip_headers: [cf-connecting-ip, true-client-ip]   # set by Cloudflare in front of Render
env: ${APP_ENV:dev}
dev_clock: {enabled_in: [dev], max_offset_days: 400}
paths:
  raw: data/raw
  parsed: data/parsed
  index: data/index
  cache: data/cache
  logs: data/logs
  frontend: frontend
